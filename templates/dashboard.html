{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">Admin Dashboard</h2>
<p class="text-muted">Welcome back, <strong>{{ session.username }}</strong>! Here is an overview of the system.</p>

<div class="row mt-4">
    <div class="col-md-6 mb-3">
        <div class="card text-white bg-primary shadow-sm h-100">
            <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                <h1 class="display-4 fw-bold">{{ total_students }}</h1>
                <h5 class="card-title">Total Registered Students</h5>
            </div>
            <div class="card-footer text-center bg-transparent border-0 mb-2">
                <a href="{{ url_for('students') }}" class="btn btn-light text-primary fw-bold">Manage Students</a>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3">
        <div class="card text-white bg-success shadow-sm h-100">
            <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                <h1 class="display-4 fw-bold">{{ total_attendance }}</h1>
                <h5 class="card-title">Total Attendance Records</h5>
            </div>
            <div class="card-footer text-center bg-transparent border-0 mb-2">
                <a href="{{ url_for('reports') }}" class="btn btn-light text-success fw-bold">View Reports</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
